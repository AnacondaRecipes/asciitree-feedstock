{% set name = "asciitree" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0c396808c13cab27b60cbe402b99ef37fa681c6b59d337a008719efa201cdd07

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.3
  run:
    - python

test:
  imports:
    - asciitree
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/mbr/asciitree
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Draws ASCII trees.
  description: Draws ASCII trees.
  dev_url: https://github.com/mbr/asciitree
  doc_url: https://github.com/mbr/asciitree

extra:
  recipe-maintainers:
    - kain88-de
    - dotsdl
